<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Perfil do utilizador no equilibr.io." />
    <meta name="theme-color" content="#d9d9d9" />
    <title>Perfil · equilibr.io</title>
    <link
      rel="icon"
      type="image/svg+xml" href="assets/img/favicon.svg?v=2"
    />
    <link rel="stylesheet" href="assets/css/landing.css" />
  </head>
  <body>
    <div class="page page-narrow">
      <header class="site-header">
        <a class="brand" href="index.html" aria-label="equilibr.io — início">
          <span class="brand-box">
            <svg class="brand-logo" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
              <rect x="3" y="3" width="58" height="58" fill="none" stroke="currentColor" stroke-width="4"/>
              <path d="M12 33H22L26 24L32 44L38 28L42 33H52" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span>equilibr.io</span>
        </a>
        <nav class="site-nav" aria-label="Navegação principal">
          <a href="app.html#dashboard">Aplicação</a>
          <a href="login.html">Entrar</a>
        </nav>
      </header>

      <main>
        <section class="form-card">
          <p class="kicker">Conta</p>
          <h1>Perfil</h1>
          <p class="small" id="profileWho">A carregar sessão…</p>

          <p id="profileStatus" class="status" role="status" aria-live="polite" hidden></p>

          <div id="profileForms" hidden>
            <form id="profileNameForm" class="stack" novalidate>
              <label for="profileName">Nome</label>
              <input id="profileName" name="name" type="text" minlength="2" maxlength="80" required />
              <button class="button" type="submit">Guardar nome</button>
            </form>

            <hr />

            <form id="profileEmailForm" class="stack" novalidate>
              <label for="profileEmail">Email</label>
              <input id="profileEmail" name="email" type="email" autocomplete="email" required />
              <button class="button" type="submit">Atualizar email</button>
            </form>

            <hr />

            <form id="profilePasswordForm" class="stack" novalidate>
              <label for="profileNewPassword">Nova palavra-passe</label>
              <input
                id="profileNewPassword"
                name="password"
                type="password"
                autocomplete="new-password"
                minlength="8"
                required
              />
              <label for="profileConfirmPassword">Confirmar palavra-passe</label>
              <input
                id="profileConfirmPassword"
                name="confirm"
                type="password"
                autocomplete="new-password"
                minlength="8"
                required
              />
              <button class="button" type="submit">Alterar palavra-passe</button>
            </form>

            <hr />

            <button class="button" type="button" id="logoutBtn">Sair da conta</button>
          </div>

          <div id="profileLoginPrompt" hidden>
            <p class="small">Entra para editares o teu perfil.</p>
            <p class="small">
              <a href="login.html">Entrar</a> ·
              <a href="app.html#dashboard">Continuar em demonstração</a>
            </p>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <a href="index.html">Voltar à página inicial</a>
        <span>Nuno Sousa · Miguel Pedrosa · Rodrigo Pinheiro · Sofia de Souza</span>
      </footer>
    </div>

    <script src="assets/vendor/supabase/supabase.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/profile.js"></script>
  </body>
</html>
