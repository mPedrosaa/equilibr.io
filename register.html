<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Criar conta no equilibr.io." />
    <meta name="theme-color" content="#d9d9d9" />
    <title>Criar conta · equilibr.io</title>
    <link
      rel="icon"
      type="image/svg+xml" href="assets/img/favicon.svg?v=2"
    />
    <link rel="stylesheet" href="assets/css/landing.css" />
  </head>
  <body>
    <div class="page page-narrow">
      <header class="site-header">
        <a class="brand" href="index.html" aria-label="equilibr.io — início">
          <span class="brand-box">
            <svg class="brand-logo" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
              <rect x="3" y="3" width="58" height="58" fill="none" stroke="currentColor" stroke-width="4"/>
              <path d="M12 33H22L26 24L32 44L38 28L42 33H52" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span>equilibr.io</span>
        </a>
        <nav class="site-nav" aria-label="Navegação principal">
          <a href="index.html">Início</a>
          <a href="login.html">Entrar</a>
        </nav>
      </header>

      <main>
        <section class="form-card">
          <p class="kicker">Registo</p>
          <h1>Criar conta</h1>
          <p class="small">Nome, email e uma palavra-passe com pelo menos 8 caracteres.</p>

          <form id="registerForm" class="stack" novalidate>
            <label for="registerName">Nome</label>
            <input
              id="registerName"
              name="name"
              type="text"
              autocomplete="name"
              minlength="2"
              maxlength="80"
              required
            />

            <label for="registerEmail">Email</label>
            <input
              id="registerEmail"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="nome@exemplo.pt"
              required
            />

            <label for="registerPassword">Palavra-passe</label>
            <input
              id="registerPassword"
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              required
            />

            <label for="registerConfirm">Confirmar palavra-passe</label>
            <input
              id="registerConfirm"
              name="confirm"
              type="password"
              autocomplete="new-password"
              minlength="8"
              required
            />

            <button class="button" type="submit">Criar conta</button>
          </form>

          <p id="authStatus" class="status" role="status" aria-live="polite" hidden></p>

          <hr />

          <p class="small">Já tens conta? <a href="login.html">Entrar</a>.</p>
          <p class="small"><a href="app.html#dashboard">Continuar em modo de demonstração</a>.</p>
        </section>
      </main>

      <footer class="site-footer">
        <a href="index.html">Voltar à página inicial</a>
        <span>Nuno Sousa · Miguel Pedrosa · Rodrigo Pinheiro · Sofia de Souza</span>
      </footer>
    </div>

    <script src="assets/vendor/supabase/supabase.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/auth.js"></script>
  </body>
</html>
