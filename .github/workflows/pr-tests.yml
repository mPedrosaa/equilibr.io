name: Testes em Pull Requests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Domínio e integração
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes de domínio
        run: npm test

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Testes de integração
        run: npm run test:integration

      - name: Guardar evidências em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
