<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Entrar no equilibr.io." />
    <meta name="theme-color" content="#d9d9d9" />
    <title>Entrar · equilibr.io</title>
    <link
      rel="icon"
      type="image/svg+xml" href="assets/img/favicon.svg?v=2"
    />
    <link rel="stylesheet" href="assets/css/landing.css" />
  </head>
  <body>
    <div class="page page-narrow">
      <header class="site-header">
        <a class="brand" href="index.html" aria-label="equilibr.io — início">
          <span class="brand-box">
            <svg class="brand-logo" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
              <rect x="3" y="3" width="58" height="58" fill="none" stroke="currentColor" stroke-width="4"/>
              <path d="M12 33H22L26 24L32 44L38 28L42 33H52" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span>equilibr.io</span>
        </a>
        <nav class="site-nav" aria-label="Navegação principal">
          <a href="index.html">Início</a>
          <a href="app.html#dashboard">Demonstração</a>
        </nav>
      </header>

      <main>
        <section class="form-card">
          <p class="kicker">Acesso</p>
          <h1>Entrar</h1>
          <p class="small">Entra na tua conta ou continua em modo de demonstração.</p>

          <form id="loginForm" class="stack" novalidate>
            <label for="loginEmail">Email</label>
            <input
              id="loginEmail"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="nome@exemplo.pt"
              required
            />

            <label for="loginPassword">Palavra-passe</label>
            <input
              id="loginPassword"
              name="password"
              type="password"
              autocomplete="current-password"
              minlength="8"
              required
            />

            <button class="button" type="submit">Entrar</button>
          </form>

          <p id="authStatus" class="status" role="status" aria-live="polite" hidden></p>

          <hr />

          <p class="small">Ainda não tens conta? <a href="register.html">Criar conta</a>.</p>
          <p class="small"><a href="app.html#dashboard">Entrar em modo de demonstração</a>.</p>
        </section>
      </main>

      <footer class="site-footer">
        <a href="index.html">Voltar à página inicial</a>
        <span>Nuno Sousa · Miguel Pedrosa · Rodrigo Pinheiro · Sofia de Souza</span>
      </footer>
    </div>

    <script src="assets/vendor/supabase/supabase.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/auth.js"></script>
  </body>
</html>
