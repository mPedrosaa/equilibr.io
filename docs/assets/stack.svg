<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" role="img" aria-label="Diagrama da stack tecnológica do equilibr.io">
  <title>Stack tecnológica do equilibr.io</title>
  <defs>
    <marker id="arrowEnd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#000000"/>
    </marker>
    <marker id="arrowStart" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10 0L0 5L10 10Z" fill="#000000"/>
    </marker>
    <style>
      .zone { fill: #ffffff; stroke: #000000; stroke-width: 2.5; }
      .box { fill: #f4f4f4; stroke: #000000; stroke-width: 1.8; }
      .box-soft { fill: #ededed; stroke: #000000; stroke-width: 1.5; }
      .zone-label { font-family: 'Times New Roman', Times, 'Liberation Serif', serif; font-size: 21px; font-weight: 700; fill: #000000; }
      .box-title { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #000000; }
      .body { font-family: Arial, Helvetica, sans-serif; font-size: 12.5px; fill: #3a3a3a; }
      .caption { font-family: Arial, Helvetica, sans-serif; font-size: 11.5px; fill: #555555; }
      .arrow { fill: none; stroke: #000000; stroke-width: 1.9; }
      .arrow-dash { fill: none; stroke: #000000; stroke-width: 1.7; stroke-dasharray: 7 6; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 11.5px; fill: #000000; }
      .label-bg { fill: #ffffff; }
      .legend { font-family: Arial, Helvetica, sans-serif; font-size: 12.5px; fill: #333333; }
    </style>
  </defs>

  <rect width="1400" height="920" fill="#ffffff"/>

  <text x="50" y="58" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-size="36" font-weight="700" fill="#000000">Stack tecnológica</text>
  <text x="50" y="86" class="caption" font-size="14">Como as componentes do equilibr.io interagem entre si.</text>

  <!-- Browser -->
  <rect x="50" y="120" width="630" height="470" class="zone"/>
  <text x="72" y="151" class="zone-label">Browser · frontend</text>

  <rect x="76" y="172" width="578" height="82" class="box"/>
  <text x="96" y="200" class="box-title">Interface</text>
  <text x="96" y="222" class="body">HTML · CSS · Bootstrap 5.3 · Bootstrap Icons</text>
  <text x="96" y="241" class="body">Landing, autenticação e SPA com navegação por hash</text>

  <rect x="76" y="282" width="280" height="92" class="box"/>
  <text x="96" y="310" class="box-title">Lógica da aplicação</text>
  <text x="96" y="332" class="body">JavaScript vanilla</text>
  <text x="96" y="351" class="body">core.js (regras) · app.js (UI)</text>

  <rect x="376" y="282" width="278" height="92" class="box"/>
  <text x="396" y="310" class="box-title">Cliente Supabase</text>
  <text x="396" y="332" class="body">supabase-js incluído localmente</text>
  <text x="396" y="351" class="body">auth · sessão · queries</text>

  <rect x="76" y="402" width="280" height="92" class="box"/>
  <text x="96" y="430" class="box-title">localStorage</text>
  <text x="96" y="452" class="body">Apenas no modo de demonstração</text>
  <text x="96" y="471" class="body">equilibr.io.state.v2</text>

  <rect x="376" y="402" width="278" height="92" class="box"/>
  <text x="396" y="430" class="box-title">config.js</text>
  <text x="396" y="452" class="body">URL + anon key públicas</text>
  <text x="396" y="471" class="body">Gerado a partir do .env</text>

  <path d="M76 528H654" stroke="#000000" stroke-width="1" opacity="0.2"/>
  <text x="76" y="551" class="caption">A anon key é pública por desenho; a service role key nunca chega ao browser.</text>

  <!-- arrows inside browser -->
  <path d="M216 254V282" class="arrow" marker-end="url(#arrowEnd)"/>
  <path d="M356 328H376" class="arrow" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  <path d="M216 374V402" class="arrow" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  <path d="M515 402V374" class="arrow" marker-end="url(#arrowEnd)"/>

  <!-- Supabase -->
  <rect x="740" y="120" width="610" height="250" class="zone"/>
  <text x="762" y="151" class="zone-label">Supabase · backend gerido</text>

  <rect x="770" y="172" width="250" height="82" class="box-soft"/>
  <text x="790" y="200" class="box-title">Auth</text>
  <text x="790" y="222" class="body">Contas · sessões</text>
  <text x="790" y="241" class="body">Palavras-passe</text>

  <rect x="1060" y="172" width="260" height="82" class="box-soft"/>
  <text x="1080" y="200" class="box-title">Postgres + RLS</text>
  <text x="1080" y="222" class="body">UCs · registos · horário</text>
  <text x="1080" y="241" class="body">avaliações · perfis</text>

  <rect x="770" y="286" width="550" height="58" class="box-soft"/>
  <text x="790" y="311" class="box-title">API gerida</text>
  <text x="790" y="331" class="body">PostgREST + endpoints de Auth · HTTPS</text>

  <path d="M900 286V254" class="arrow" marker-end="url(#arrowEnd)"/>
  <path d="M1190 286V254" class="arrow" marker-end="url(#arrowEnd)"/>

  <!-- Browser -> Supabase -->
  <path d="M654 328L770 315" class="arrow" marker-end="url(#arrowEnd)"/>
  <rect x="684" y="306" width="74" height="17" class="label-bg"/>
  <text x="687" y="319" class="label">HTTPS</text>

  <!-- Build & deploy -->
  <rect x="740" y="400" width="610" height="240" class="zone"/>
  <text x="762" y="431" class="zone-label">Build &amp; deploy</text>

  <rect x="770" y="454" width="240" height="74" class="box"/>
  <text x="790" y="481" class="box-title">.env</text>
  <text x="790" y="503" class="body">Local · não versionado</text>
  <text x="790" y="520" class="body">segredos e chaves</text>

  <rect x="1050" y="454" width="270" height="74" class="box"/>
  <text x="1070" y="481" class="box-title">npm run config / build</text>
  <text x="1070" y="503" class="body">Scripts Node</text>
  <text x="1070" y="520" class="body">gera config.js e dist/</text>

  <rect x="770" y="580" width="240" height="54" class="box"/>
  <text x="790" y="603" class="box-title">dist/</text>
  <text x="790" y="622" class="body">Site estático</text>

  <rect x="1050" y="580" width="270" height="54" class="box"/>
  <text x="1070" y="603" class="box-title">Vercel</text>
  <text x="1070" y="622" class="body">Serve o site · HTTPS</text>

  <path d="M1010 491H1050" class="arrow" marker-end="url(#arrowEnd)"/>
  <path d="M1090 528L1010 580" class="arrow" marker-end="url(#arrowEnd)"/>
  <path d="M1010 607H1050" class="arrow" marker-end="url(#arrowEnd)"/>

  <!-- npm run config -> config.js -->
  <path d="M1185 454V445H654" class="arrow-dash" marker-end="url(#arrowEnd)"/>

  <!-- GitHub / quality -->
  <rect x="50" y="620" width="630" height="230" class="zone"/>
  <text x="72" y="651" class="zone-label">GitHub · qualidade</text>

  <rect x="76" y="674" width="255" height="80" class="box"/>
  <text x="96" y="702" class="box-title">Pull Requests</text>
  <text x="96" y="724" class="body">Revisão e integração</text>
  <text x="96" y="743" class="body">na branch main</text>

  <rect x="360" y="674" width="294" height="80" class="box"/>
  <text x="380" y="702" class="box-title">GitHub Actions</text>
  <text x="380" y="724" class="body">Testes automáticos</text>
  <text x="380" y="743" class="body">em cada Pull Request</text>

  <rect x="76" y="788" width="578" height="44" class="box"/>
  <text x="96" y="815" class="box-title">node:test + Playwright</text>
  <text x="310" y="815" class="body">13 testes de domínio · 9 fluxos de integração</text>

  <path d="M331 714H360" class="arrow" marker-end="url(#arrowEnd)"/>
  <path d="M507 754V788" class="arrow" marker-end="url(#arrowEnd)"/>

  <!-- Legend -->
  <path d="M60 890H110" class="arrow" marker-end="url(#arrowEnd)"/>
  <text x="122" y="894" class="legend">execução / runtime</text>
  <path d="M300 890H350" class="arrow-dash" marker-end="url(#arrowEnd)"/>
  <text x="362" y="894" class="legend">geração / CI</text>
</svg>
